name: Historical data compatibility

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  restore-historical-data:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore prior releases and verify frozen fixtures
        shell: bash
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASELINE" && ! "$BASELINE" =~ ^0+$ ]] && git cat-file -e "${BASELINE}^{commit}" 2>/dev/null; then
            npm run test:compatibility -- --baseline "$BASELINE"
          else
            npm run test:compatibility
          fi
